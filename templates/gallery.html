{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', path='css/reotoi-ui.css') }}">
{% endblock %}

{% block content %}
<section class="gallery-page" aria-labelledby="gallery-title">
  <div class="section-heading section-heading--wide gallery-heading">
    <h1 id="gallery-title">Your gallery</h1>
  </div>
  <section id="gallery-empty" class="gallery-empty" aria-labelledby="empty-title">
    <div class="gallery-empty__mark" aria-hidden="true"><span></span><span></span><span></span></div>
    <h2 id="empty-title">Make your first piece.</h2>
    <p>Record your voice or choose an audio file.</p>
    <a class="button button--primary" href="/create">Create artwork</a>
  </section>
  <section id="gallery-list" class="gallery-grid" aria-live="polite" aria-label="Saved artwork"></section>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', path='js/gallery.js') }}" defer></script>
{% endblock %}
