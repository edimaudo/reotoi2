{% extends "base.html" %}

{% block content %}
<section class="creation-page" aria-labelledby="login-title">
    <div class="creation-panel auth-panel">
        <h1 id="login-title" class="auth-title">Log in to reotoi</h1>
        <p>Sign in to turn your voice into art.</p>

        {% if demo_username %}
        <div class="demo-credentials" role="note" aria-label="Demo account">
            <p><strong>Demo account</strong></p>
            <dl class="feature-list" style="margin-top:.5rem">
                <div><dt>Username</dt><dd><code>{{ demo_username }}</code></dd></div>
                <div><dt>Password</dt><dd><code>{{ demo_password }}</code></dd></div>
            </dl>
        </div>
        {% endif %}

        <form method="post" action="/login" novalidate>
            <input type="hidden" name="next" value="{{ next }}">
            <label class="field" for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label class="field" for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
            <div class="form-actions" style="margin-top:1.5rem">
                <button class="button button--primary" type="submit">Log in</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
