{% extends "base.html" %}
{% block content %}
<section class="creation-page auth-page" aria-labelledby="login-title">
  <div class="creation-panel auth-panel">
    <h1 id="login-title">Log in to reotoi</h1>
    <p>Sign in to create artwork and save pieces to this browser's gallery.</p>
    <div class="demo-credentials" role="note" aria-label="Default demo credentials">
      <p>The configured demo username and password are prefilled. Edit either field if needed.</p>
    </div>
    <form method="post" action="/login" class="login-form">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">Username</label>
      <input id="username" name="username" type="text" value="{{ demo_username }}" autocomplete="username" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" value="{{ demo_password }}" autocomplete="current-password" required>
      {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
      <div class="form-actions"><button class="button button--primary" type="submit">Log in</button></div>
    </form>
  </div>
</section>
{% endblock %}
